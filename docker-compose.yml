services:
  # The always-on app: web page on :8080, Telegram bot, trading bot.
  #   cp deploy/botkeep/.env.example .env  (fill it in), then: docker compose up -d bot
  bot:
    build: .
    entrypoint: ["python", "main_botkeep.py"]
    env_file:
      - .env
    environment:
      - DATA_DIR=/home/appuser/.tradingagents/bot
    ports:
      - "8080:8080"
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    restart: unless-stopped
    profiles:
      - bot

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
